<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>skip2004</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e0e0e0;
    }
    .card {
      text-align: center;
      padding: 3rem 4rem;
      border: 1px solid #333;
      border-radius: 12px;
      background: #16213e;
    }
    .card h1 {
      font-size: 2rem;
      font-weight: 300;
      margin-bottom: 2rem;
      letter-spacing: 0.05em;
    }
    .card a {
      display: inline-block;
      padding: 0.75rem 2rem;
      color: #e0e0e0;
      text-decoration: none;
      border: 1px solid #555;
      border-radius: 6px;
      font-size: 1rem;
      transition: background 0.2s, border-color 0.2s;
    }
    .card a:hover {
      background: #0f3460;
      border-color: #888;
    }
  </style>
</head>

  <div class="card">
    <h1>skip2004</h1>
