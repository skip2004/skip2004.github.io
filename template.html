<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICPC 模板</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #525659; }
    .back {
      position: fixed;
      top: 12px;
      left: 16px;
      z-index: 10;
    }
    .back a {
      color: #ccc;
      text-decoration: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.9rem;
      padding: 4px 10px;
      border: 1px solid #666;
      border-radius: 4px;
      transition: color 0.2s, border-color 0.2s;
    }
    .back a:hover {
      color: #fff;
      border-color: #aaa;
    }
    embed {
      display: block;
      width: 100vw;
      height: 100vh;
      border: none;
    }
  </style>
</head>
<body>
  <div class="back"><a href="index.html">← 返回</a></div>
  <embed src="ICPC-Templates/main.pdf" type="application/pdf">
</body>
</html>
